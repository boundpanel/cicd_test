[tool.poetry]
name = "scrm-etl"
version = "0.1.0"
description = "Base PySpark job for standardized event ingestion into Delta Lake"
authors = ["SCRM Data Engineering"]
readme = "README.md"
packages = [{ include = "scrm_etl", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11,<3.13"
pyspark = "3.5.3"
delta-spark = "3.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
ruff = "^0.6.9"

[tool.poetry.scripts]
scrm-etl = "scrm_etl.job:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
